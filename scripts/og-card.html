<!doctype html>
<!--
  Source for public/og-image.png (1200×630 social card).

  This file is NOT part of the build. It is rendered once in a browser and
  exported as a PNG. To regenerate after changing the name, role or URL:

    1. open this file in a browser (or Playwright) at a 1200×630 viewport
    2. screenshot the viewport at device scale 1
    3. save over public/og-image.png

  The font is loaded from node_modules so it matches the site exactly.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 900;
        font-display: block;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 74px 88px;
        background: #0f172a;
        color: #e2e8f0;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .glow {
        position: absolute;
        top: -300px;
        right: -220px;
        width: 720px;
        height: 720px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(94, 234, 212, 0.12), transparent 66%);
      }

      .top {
        display: flex;
        align-items: center;
        gap: 18px;
        position: relative;
      }

      .rule {
        width: 46px;
        height: 1px;
        background: #5eead4;
      }

      .kicker {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: #94a3b8;
      }

      main {
        position: relative;
      }

      h1 {
        font-size: 104px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.045em;
        color: #e2e8f0;
      }

      .role {
        margin-top: 28px;
        font-size: 29px;
        font-weight: 400;
        letter-spacing: -0.012em;
        color: #94a3b8;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: relative;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #5eead4;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #5eead4;
      }

      .url {
        font-size: 17px;
        letter-spacing: -0.005em;
        color: #94a3b8;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>

    <header class="top">
      <span class="rule"></span>
      <span class="kicker">Portfolio</span>
    </header>

    <main>
      <h1>Roan Pantalla</h1>
      <p class="role">IT Support &amp; Systems | Full-Stack Developer</p>
    </main>

    <footer>
      <span class="status"><span class="dot"></span> Open to internships</span>
      <span class="url">roanrp-portfolio.vercel.app</span>
    </footer>
  </body>
</html>
